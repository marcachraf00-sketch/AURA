<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA - Create Profile</title>
<style>
  body {
    background: #0f172a; 
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }

  .auth-container {
    background: rgba(255, 255, 255, 0.01);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 24px;
    padding: 32px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 8px 0;
    color: #ffffff;
  }

  .subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin: 0 0 24px 0;
  }

  label {
    display: block;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 6px;
    text-align: left;
  }

  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: #1e293b;
    color: white;
    box-sizing: border-box;
    font-size: 14px;
  }

  input:focus {
    outline: none;
    border-color: #3b82f6;
  }

  .code-group {
    margin-bottom: 20px;
    background: rgba(244, 114, 182, 0.02);
    padding: 12px;
    border-radius: 16px;
    border: 1px dashed rgba(244, 114, 182, 0.2);
  }

  .code-input {
    border-color: rgba(244, 114, 182, 0.3);
    margin-bottom: 6px;
  }
  
  .code-input:focus {
    border-color: #f472b6;
  }

  .code-help-text {
    font-size: 11px;
    color: #f472b6;
    text-align: left;
    margin: 0;
    padding-left: 2px;
    display: block;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: #3b82f6;
    color: white;
    transition: background 0.2s ease;
  }

  .submit-btn:hover {
    background: #2563eb;
  }

  .footer-links {
    margin-top: 20px;
    font-size: 13px;
    color: #64748b;
  }

  .footer-links a {
    color: #3b82f6;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="auth-container">
  <h1>Create Portal Account</h1>
  <p class="subtitle">Set up your AURA profile</p>

  <form id="signup-form" onsubmit="handleUserSignup(event)">
    
    <div class="code-group">
      <label for="invite-code" style="color: #f472b6; font-weight: 600;">Activation Invite Code</label>
      <input type="text" id="invite-code" class="code-input" placeholder="e.g., AURA-NFC-XXXX" required>
      <small class="code-help-text">🔑 Received manually upon delivery verification payment check.</small>
    </div>

    <label for="user-name">Full Name</label>
    <input type="text" id="user-name" placeholder="Ahmed Mohammed" required>

    <label for="user-email">Email Address</label>
    <input type="email" id="user-email" placeholder="name@example.com" required>

    <label for="user-password">Password (Min. 6 characters)</label>
    <input type="password" id="user-password" placeholder="••••••••" required>

    <button type="submit" class="submit-btn">Register Profile Portal</button>
  </form>

  <div class="footer-links">
    Already registered?
    <a href="index.html" style="color: #64748b;">← Return to Main Page</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const localSupabase = window.supabase.createClient(
    'https://zndniherjshrerioqodx.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZG5paGVyanNocmVyaW9xb2R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyOTE4MTgsImV4cCI6MjA5Nzg2NzgxOH0.WM0zBNAKI9vniV174I99FmEBQ25gB8hti2ZeoshUMTo'
  );

  async function handleUserSignup(event) {
    event.preventDefault();
    
    const inviteCode = document.getElementById('invite-code').value.trim();
    const fullName = document.getElementById('user-name').value.trim();
    const emailStr = document.getElementById('user-email').value;
    const passwordStr = document.getElementById('user-password').value;

    const enteredCode = document.getElementById('activation-code-input').value.trim().toUpperCase();

const { data: codeData, error: codeError } = await localSupabase
  .from('invite_codes')
  .select('*')
  .eq('code', enteredCode)
  .eq('used', false)
  .maybeSingle();

if (codeError || !codeData) {
  alert("❌ Invalid or already activated code!");
  return;
    }

    const { data: authData, error: authError } = await localSupabase.auth.signUp({
      email: emailStr,
      password: passwordStr,
      options: {
        data: {
          full_name: fullName
        }
      }
    });

    if (authError) {
      alert("Registration Error: " + authError.message);
      return;
    }

    if (authData.user) {
      await localSupabase
        .from('invite_codes')
        .update({ is_used: true })
        .eq('code', inviteCode);

      alert("Account created successfully! Welcome to your AURA profile portal.");
      window.location.href = 'dashboard.html'; 
    }
  }
</script>

</body>
</html>
