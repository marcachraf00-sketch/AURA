<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Profile View</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div id="profile-card" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
    
    <div id="status-state" class="flex flex-col items-center justify-center py-8 text-center">
      <div id="profile-avatar-placeholder" class="w-24 h-24 bg-gradient-to-tr from-purple-500 to-indigo-500 rounded-full flex items-center justify-center text-3xl font-bold mb-4 shadow-lg shadow-indigo-500/20">
        A
      </div>
      <h2 id="status-title" class="text-2xl font-bold tracking-tight">Loading Profile...</h2>
      <div id="status-level-badge" class="mt-2 px-3 py-1 bg-slate-800/80 rounded-full text-xs text-slate-400 font-medium">
        Level --
      </div>
      
      <div class="w-full mt-6">
        <div class="flex justify-between text-xs text-slate-400 mb-1 font-medium">
          <span>Level Progress</span>
          <span id="status-xp-counter">-- / 200 XP</span>
        </div>
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
          <div id="status-xp-bar" class="bg-gradient-to-r from-teal-400 to-emerald-400 h-full w-0 transition-all duration-500"></div>
        </div>
      </div>
    </div>

    <div id="profile-data-state" class="hidden flex flex-col space-y-6">
      <div class="text-center">
        <h1 id="profile-username" class="text-3xl font-black tracking-tight text-white mb-1">username</h1>
        <p class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Verified Aura Operator</p>
      </div>

      <div>
        <p class="text-xs uppercase tracking-wider text-slate-500 font-bold mb-2">Interests Matrix</p>
        <div id="interests-container" class="flex flex-wrap gap-2">
          </div>
      </div>

      <div class="border-t border-slate-800/60 pt-4">
        <div class="flex justify-between items-baseline mb-1">
          <span class="text-sm font-bold text-slate-300">Level</span>
          <span id="profile-level" class="text-xl font-black text-sky-400">1</span>
        </div>
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-2">
          <div id="profile-xp-bar" class="bg-gradient-to-r from-sky-400 to-blue-500 h-full w-0 transition-all duration-300"></div>
        </div>
        <div class="flex justify-between text-xs font-semibold text-emerald-400">
          <span>XP</span>
          <span id="profile-xp-counter">0 / 200 XP</span>
        </div>
      </div>
    </div>

    <div id="notification-toast" class="hidden mt-4 bg-emerald-950/80 border border-emerald-500/30 rounded-xl p-3 text-center transition-all duration-300">
      <p class="text-xs text-emerald-400 font-semibold flex items-center justify-center gap-1.5">
        ✨ NFC Card Scan Successful! +100 XP added.
      </p>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. SUPABASE CONNECTION CONFIGURATION
    // ==========================================
    const SUPABASE_URL = "https://zndniherjshrerioqodx.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZG5paGVyanNocmVyaW9xb2R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyOTE4MTgsImV4cCI6MjA5Nzg2NzgxOH0.WM0zBNAKI9vniV174I99FmEBQ25gB8hti2ZeoshUMTo";

    // Initialize Client Connection
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // 2. RUN APPLICATION WORKFLOW
    // ==========================================
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const ownerId = urlParams.get('owner_id');
      const tapSuccess = urlParams.get('tap_success');

      if (tapSuccess === 'true') {
        document.getElementById("notification-toast").classList.remove("hidden");
      }

      if (ownerId) {
        fetchProfileData(ownerId);
      } else {
        showErrorState("No Profile ID Found");
      }
    });

    // ==========================================
    // 3. DATABASE CONTROLLER
    // ==========================================
    async function fetchProfileData(id) {
      console.log(`Fetching profile for ID: ${id}`);
      try {
        const { data, error } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', id)
          .single();

        if (error) throw error;
        if (data) {
          renderLoadedProfile(data);
        } else {
          showErrorState("Profile Not Found");
        }
      } catch (err) {
        console.error("Database error details:", err);
        showErrorState("Error Loading Profile");
      }
    }

    // ==========================================
    // 4. DATA SANITIZATION & DOM RENDERING
    // ==========================================
    function renderLoadedProfile(data) {
      document.getElementById("status-state").classList.add("hidden");
      document.getElementById("profile-data-state").classList.remove("hidden");

      document.getElementById("profile-username").textContent = data.username || "Anonymous Operator";
      document.getElementById("profile-level").textContent = data.level || "1";
      
      const currentXp = data.xp || 0;
      const targetXp = 200; 
      document.getElementById("profile-xp-counter").textContent = `${currentXp} / ${targetXp} XP`;
      
      const xpPercentage = Math.min((currentXp / targetXp) * 100, 100);
      document.getElementById("profile-xp-bar").style.width = `${xpPercentage}%`;

      // --- INTERESTS MATRIX SANITIZATION ---
      const container = document.getElementById("interests-container");
      container.innerHTML = ""; 

      let rawInterests = [];

      if (Array.isArray(data.interests)) {
        rawInterests = data.interests;
      } else if (typeof data.interests === 'string' && data.interests.trim() !== "") {
        try {
          let parsed = JSON.parse(data.interests);
          if (Array.isArray(parsed)) {
            rawInterests = parsed;
          } else {
            rawInterests = data.interests.split(',');
          }
        } catch (e) {
          rawInterests = data.interests.split(',');
        }
      }

      const cleanInterests = rawInterests
        .map(item => {
          if (typeof item === 'string') {
            return item.replace(/[\[\]\\"]/g, '').trim();
          }
          return String(item).trim();
        })
        .filter(item => item !== "");

      if (cleanInterests.length === 0) {
        container.innerHTML = `<span class="text-xs text-slate-500 italic">No interests specified</span>`;
      } else {
        cleanInterests.forEach(interest => {
          const badge = document.createElement("span");
          badge.className = "px-3 py-1 bg-sky-950/50 border border-sky-500/20 rounded-xl text-xs font-bold text-sky-400 shadow-sm shadow-sky-500/5";
          badge.textContent = interest;
          container.appendChild(badge);
        });
      }
    }

    function showErrorState(message) {
      document.getElementById("status-title").textContent = message;
      document.getElementById("profile-avatar-placeholder").className = "w-24 h-24 bg-rose-950 border border-rose-500/30 rounded-full flex items-center justify-center text-3xl font-bold mb-4 text-rose-400";
      document.getElementById("profile-avatar-placeholder").textContent = "!";
    }
  </script>
</body>
</html>
