<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Operator Profile</title>

<style>
  body {
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    letter-spacing: -0.01em;
    position: relative;
    overflow-x: hidden;
    user-select: none;
    padding: 20px;
    box-sizing: border-box;
  }

  .bg-fullscreen {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    object-fit: cover; z-index: -2;
  }

  .bg-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    z-index: -1;
  }

  .profile-card {
    width: 100%;
    max-width: 340px;
    text-align: center;
    padding: 40px 24px;
    box-sizing: border-box;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 24px;
    backdrop-filter: blur(10px);
  }

  .avatar-container {
    position: relative;
    width: 100px;
    height: 100px;
    margin: 0 auto 20px auto;
  }

  .profile-pic {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(56, 189, 248, 0.4);
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 6px 0;
    color: #ffffff;
  }

  .age-badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.07);
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 16px;
    font-weight: 500;
  }

  .subtitle {
    font-size: 12px;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin: 0 0 32px 0;
  }

  .subtitle.nfc-active {
    color: #00ff88;
  }

  .interests-section {
    text-align: left;
    margin-bottom: 32px;
  }

  .interests-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #64748b;
    font-weight: 700;
    margin-bottom: 10px;
    display: block;
  }

  .interests-box {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .interest-tag {
    background: rgba(59, 130, 246, 0.1);
    border: 1px solid rgba(59, 130, 246, 0.2);
    color: #38bdf8;
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
  }

  .stats-container {
    width: 100%;
    text-align: left;
  }

  .stat-item {
    margin-bottom: 20px;
  }

  .stat-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 14px;
  }

  .stat-label { color: #cbd5e1; }
  .stat-value { font-weight: 600; color: #38bdf8; }

  .progress-bar-bg {
    width: 100%; height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #0284c7, #38bdf8);
    width: 0%;
    transition: width 1s ease;
  }

  #loading-msg {
    font-size: 14px;
    color: #94a3b8;
  }
</style>
</head>
<body>

<img src="logo.png" alt="Background" class="bg-fullscreen">
<div class="bg-overlay"></div>

<div id="loading-msg">Accessing matrix card profile...</div>

<div class="profile-card" id="profile-content" style="display: none;">
  <div class="avatar-container">
    <img id="user-avatar" src="" alt="Avatar" class="profile-pic">
  </div>

  <h1 id="name">---</h1>
  <div id="age-display" class="age-badge" style="display: none;"></div>
  <p class="subtitle" id="status-sub">Aura Network Link Verified</p>

  <div class="interests-section">
    <span class="interests-label">Interests Matrix</span>
    <div id="interests-container" class="interests-box"></div>
  </div>

  <div class="stats-container">
    <div class="stat-item">
      <div class="stat-info">
        <span class="stat-label">Operator Level</span>
        <span class="stat-value" id="level-val">1</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="level-fill"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  if (!window.supabase) return;

  const localSupabase = window.supabase.createClient(
    'https://zndniherjshrerioqodx.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZG5paGVyanNocmVyaW9xb2R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyOTE4MTgsImV4cCI6MjA5Nzg2NzgxOH0.WM0zBNAKI9vniV174I99FmEBQ25gB8hti2ZeoshUMTo'
  );

  async function loadGuestView() {
    const urlParams = new URLSearchParams(window.location.search);
    const ownerId = urlParams.get('owner_id') || "21f3064f-60af-4909-b751-2446033af104"; // Default fallback tracking ID
    const sub = document.getElementById('status-sub');

    if (!ownerId) {
      document.getElementById('loading-msg').innerText = "❌ Missing Operator Link Signature.";
      return;
    }

    try {
      // 1. Log the scan entry into nfc_scans to advance challenges instantly
      // We omit 'id' completely so Postgres safely generates a fresh unique ID automatically
      const { error: scanError } = await localSupabase
        .from('nfc_scans')
        .insert([
          {
            claimed: true,
            claimed_by: ownerId,
            claimed_at: new Date().toISOString()
          }
        ]);

      if (scanError) {
        console.error("🔒 Challenge metric logging blocked by system:", scanError.message);
      } else {
        console.log("⚡ Scan successfully logged to nfc_scans table.");
      }

      // 2. Trigger the shared public procedure function to deposit +20 XP
      const { error: rpcError } = await localSupabase.rpc('increment_xp', { user_id: ownerId, xp_to_add: 20 });
      
      if (!rpcError) {
        sub.innerText = "⚡ Secure NFC Tap Verified: +20 XP Added!";
        sub.classList.add('nfc-active');
      } else {
        console.error("🔒 XP update error:", rpcError.message);
      }

      // 3. Fetch the updated real profile data strictly
      const { data: profData, error: profileError } = await localSupabase
        .from('profiles')
        .select('*')
        .eq('id', ownerId)
        .maybeSingle();
      
      if (profileError || !profData) {
        document.getElementById('loading-msg').innerText = "❌ Profile Signature Not Found in Database.";
        return;
      }

      // 4. Render real profile parameters to screen securely
      document.getElementById('name').innerText = profData.username || "Anonymous Operator";
      document.getElementById('level-val').innerText = profData.level || 1;
      document.getElementById('level-fill').style.width = Math.min(((profData.level || 1) / 100) * 100, 100) + "%";

      if (profData.age) {
        document.getElementById('age-display').innerText = "Age: " + profData.age;
        document.getElementById('age-display').style.display = 'inline-block';
      }

      document.getElementById('user-avatar').src = profData.avatar_url || "https://api.dicebear.com/7.x/bottts/svg?seed=Unknown";

      // Render tags matrix
      const tagsContainer = document.getElementById('interests-container');
      const interests = Array.isArray(profData.interests) ? profData.interests : (profData.interests ? profData.interests.split(',') : []);
      
      if (interests.length === 0) {
        tagsContainer.innerHTML = '<span style="color:#475569; font-style:italic; font-size:13px;">No matrix parameters initialized.</span>';
      } else {
        interests.forEach(t => {
          if (t.trim()) {
            const span = document.createElement('span');
            span.className = 'interest-tag';
            span.innerText = t.trim();
            tagsContainer.appendChild(span);
          }
        });
      }

      // Flip layouts
      document.getElementById('loading-msg').style.display = 'none';
      document.getElementById('profile-content').style.display = 'block';

    } catch (e) {
      console.error(e);
      document.getElementById('loading-msg').innerText = "❌ Core network sync failure.";
    }
  }

  loadGuestView();
})();
</script>
</body>
</html>
