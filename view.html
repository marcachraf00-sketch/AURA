<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Card Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Supabase JS Client library explicitly first -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-24 h-24 bg-gradient-to-tr from-purple-500 to-indigo-500 rounded-full mx-auto flex items-center justify-center text-3xl font-bold shadow-lg shadow-indigo-500/20">
                A
            </div>
            <h1 id="username-display" class="text-2xl font-extrabold tracking-tight mt-3 text-slate-100">Loading Profile...</h1>
            <span id="level-display" class="inline-block bg-indigo-500/10 text-indigo-400 text-sm font-semibold px-3 py-1 rounded-full border border-indigo-500/20">
                Level --
            </span>
        </div>

        <div class="space-y-2">
            <div class="flex justify-between text-sm font-medium text-slate-400">
                <span>Level Progress</span>
                <span id="xp-text-display">-- / 200 XP</span>
            </div>
            <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
                <div id="xp-bar-fill" class="bg-gradient-to-r from-purple-500 to-indigo-500 h-full w-0 transition-all duration-700 ease-out"></div>
            </div>
        </div>

        <div id="status-toast" class="hidden p-4 rounded-xl text-center text-sm font-medium border"></div>

    </div>

    <script>
        // 1. Initialize variables after scripts are fully parsed
        const SUPABASE_URL = "https://zndniherjshrerioqodx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZG5paGVyanNocmVyaW9xb2R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyOTE4MTgsImV4cCI6MjA5Nzg2NzgxOH0.4YmH4l0O_e2S_Q_4Z08O_9_rG2O_w_O_4_O_4_O_4"; 
        
        // Correct initialization namespace
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const ownerId = urlParams.get('owner_id');
        const tapSuccess = urlParams.get('tap_success');
        const cooldownActive = urlParams.get('error');

        const toast = document.getElementById('status-toast');
        if (tapSuccess === 'true') {
            toast.className = "block bg-emerald-500/10 text-emerald-400 border-emerald-500/20 p-4 rounded-xl text-center text-sm font-medium";
            toast.innerText = "✨ NFC Card Scan Successful! +100 XP added.";
        } else if (cooldownActive === 'cooldown') {
            toast.className = "block bg-amber-500/10 text-amber-400 border-amber-500/20 p-4 rounded-xl text-center text-sm font-medium";
            toast.innerText = "⏳ Cooldown Active: This card can only be tapped once per day.";
        }

        async function fetchUserProfile() {
            if (!ownerId) {
                document.getElementById('username-display').innerText = "No User ID Provided";
                return;
            }

            console.log("Fetching profile for ID:", ownerId);

            const { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', ownerId)
                .maybeSingle(); // Fallback cleanly if item is missing

            if (error) {
                console.error("Database error details:", error);
                document.getElementById('username-display').innerText = "Error Loading Profile";
                return;
            }

            if (!profile) {
                console.error("No row matches id:", ownerId);
                document.getElementById('username-display').innerText = "User Profile Missing";
                return;
            }

            console.log("Profile Data Found:", profile);

            const totalXP = profile.xp || 0; 
            const username = profile.username || profile.full_name || "Aura User";
            
            const xpPerLevel = 200;
            const currentLevel = Math.floor(totalXP / xpPerLevel) + 1;
            const currentLevelXP = totalXP % xpPerLevel;
            const progressPercentage = (currentLevelXP / xpPerLevel) * 100;

            document.getElementById('username-display').innerText = username;
            document.getElementById('level-display').innerText = `Level ${currentLevel}`;
            document.getElementById('xp-text-display').innerText = `${currentLevelXP} / ${xpPerLevel} XP`;
            document.getElementById('xp-bar-fill').style.width = `${progressPercentage}%`;
        }

        fetchUserProfile();
    </script>
</body>
</html>
