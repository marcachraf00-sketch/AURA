<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA - Get My Card</title>

<style>
  body {
    background: #0f172a; 
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 40px 20px;
    box-sizing: border-box;
    letter-spacing: -0.01em;
  }

  /* Glassmorphic Container Layout */
  .store-container {
    width: 100%;
    max-width: 900px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 8px 0;
    letter-spacing: -0.02em;
    color: #ffffff;
  }

  .subtitle {
    color: #94a3b8;
    font-size: 15px;
    margin: 0;
  }

  /* Section Headings */
  .section-title {
    font-size: 18px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #94a3b8;
    margin: 32px 0 16px 0;
    border-left: 3px solid #3b82f6;
    padding-left: 10px;
  }

  .section-title.girly {
    color: #f472b6;
    border-left-color: #f472b6;
  }

  /* Product Selection Grid */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }

  /* Exclusive Single Card Placement Container */
  .exclusive-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 280px));
    gap: 20px;
    margin-bottom: 40px;
  }

  .product-card {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .product-card:hover {
    transform: translateY(-6px);
    border-color: rgba(59, 130, 246, 0.4);
    box-shadow: 0 12px 24px -10px rgba(59, 130, 246, 0.15);
  }

  /* Girly Exclusive Card Hover Variant */
  .product-card.girly-exclusive:hover {
    border-color: rgba(244, 114, 182, 0.4);
    box-shadow: 0 12px 24px -10px rgba(244, 114, 182, 0.2);
  }

  /* Card Image Display Styling */
  .card-preview-img {
    width: 100%;
    height: 130px;
    object-fit: contain;
    margin-bottom: 20px;
    border-radius: 8px;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.5));
    transition: transform 0.3s ease;
  }

  .product-card:hover .card-preview-img {
    transform: scale(1.04) rotate(-1deg);
  }

  .product-title {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 6px 0;
    color: #ffffff;
  }

  .product-price {
    font-size: 15px;
    color: #34d399;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .exclusive-price {
    color: #f472b6 !important;
  }

  /* Input Forms Elements */
  .checkout-section {
    background: rgba(255, 255, 255, 0.01);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 24px;
    padding: 28px;
    box-sizing: border-box;
  }

  h2 {
    font-size: 20px;
    margin: 0 0 16px 0;
    color: #ffffff;
  }

  label {
    display: block;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 6px;
    text-align: left;
  }

  input, textarea {
    width: 100%;
    padding: 14px;
    margin-bottom: 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.02);
    color: white;
    box-sizing: border-box;
    font-size: 14px;
    font-family: inherit;
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: #3b82f6;
    background: rgba(255, 255, 255, 0.04);
  }

  /* Buttons */
  button {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.05);
    color: #f1f5f9;
    transition: all 0.2s ease;
  }

  button:hover {
    background: rgba(255, 255, 255, 0.12);
  }

  .girly-btn {
    background: rgba(244, 114, 182, 0.1);
    border-color: rgba(244, 114, 182, 0.2);
    color: #f472b6;
  }

  .girly-btn:hover {
    background: rgba(244, 114, 182, 0.2);
    border-color: rgba(244, 114, 182, 0.4);
  }

  button.pay-btn {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 16px;
    font-size: 15px;
  }

  button.pay-btn:hover {
    background: #2563eb;
  }

  .cart-row {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
</style>
</head>
<body>

<div class="store-container">
  
  <header>
    <h1>AURA Store</h1>
    <p class="subtitle">Deploy your physical NFC identity vector link</p>
  </header>

  <div class="section-title">Core Collection</div>
  <div class="product-grid">
    
    <!-- Card 1: Standard -->
    <div class="product-card">
      <img src="standard.png" alt="Aura Standard Card" class="card-preview-img">
      <div>
        <div class="product-title">Aura Standard</div>
        <div class="product-price">1,500 EGP</div>
        <button onclick="addToOrderCart('Aura Standard', 1500)">Add To Order</button>
      </div>
    </div>

    <!-- Card 2: Prism -->
    <div class="product-card">
      <img src="prism.png" alt="Aura Prism Card" class="card-preview-img">
      <div>
        <div class="product-title">Aura Prism</div>
        <div class="product-price">2,200 EGP</div>
        <button onclick="addToOrderCart('Aura Prism', 2200)">Add To Order</button>
      </div>
    </div>

    <!-- Card 3: Profile Pro -->
    <div class="product-card">
      <img src="profilepro.png" alt="Aura Profile Pro Card" class="card-preview-img">
      <div>
        <div class="product-title">Profile Pro</div>
        <div class="product-price">2,900 EGP</div>
        <button onclick="addToOrderCart('Profile Pro', 2900)">Add To Order</button>
      </div>
    </div>

    <!-- Card 4: Void -->
    <div class="product-card">
      <img src="void.png" alt="Aura Void Card" class="card-preview-img">
      <div>
        <div class="product-title">Aura Void</div>
        <div class="product-price">3,500 EGP</div>
        <button onclick="addToOrderCart('Aura Void', 3500)">Add To Order</button>
      </div>
    </div>

  </div>

  <!-- New Girly Exclusive Selection Segment -->
  <div class="section-title girly">Exclusive</div>
  <div class="exclusive-grid">
    <div class="product-card girly-exclusive">
      <img src="heraura.jpeg" alt="Her Aura Card" class="card-preview-img">
      <div>
        <div class="product-title" style="color: #f472b6;">Her Aura</div>
        <div class="product-price exclusive-price">3,900 EGP</div>
        <button class="girly-btn" onclick="addToOrderCart('Her Aura', 3900)">Add To Order</button>
      </div>
    </div>
  </div>

  <div class="checkout-section">
    <h2>Delivery Details & Checkout</h2>
    
    <label for="cust-shipping">Shipping Delivery Address (Egypt)</label>
    <textarea id="cust-shipping" rows="3" placeholder="Street Name, Building/Apartment No., City, Governorate"></textarea>

    <div class="cart-row">
      <span>Selected Items: <strong id="cart-item-count" style="color: #fff;">0</strong></span>
      <span id="cart-price-total" style="color: #34d399;">0 EGP</span>
    </div>

    <button class="pay-btn" onclick="executeOrderCheckout()">Proceed to Secure Payment</button>
    <button onclick="window.location.href='index.html'" style="margin-top: 12px; background: transparent; border: none; color: #64748b; font-size: 13px;">← Return to Main Portal</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const localSupabase = window.supabase.createClient(
    'https://zndniherjshrerioqodx.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZG5paGVyanNocmVyaW9xb2R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyOTE4MTgsImV4cCI6MjA5Nzg2NzgxOH0.WM0zBNAKI9vniV174I99FmEBQ25gB8hti2ZeoshUMTo'
  );

  let dynamicCart = [];
  let orderTotalEGP = 0;

  function addToOrderCart(styleName, costEGP) {
    dynamicCart.push({ cardStyle: styleName, price: costEGP });
    orderTotalEGP += costEGP;

    // Instantly modify display metrics outputs
    document.getElementById('cart-item-count').innerText = dynamicCart.length;
    document.getElementById('cart-price-total').innerText = orderTotalEGP.toLocaleString() + " EGP";
  }

  async function executeOrderCheckout() {
    const addressInput = document.getElementById('cust-shipping').value;

    if (dynamicCart.length === 0) {
      alert("Your card selection array is empty! Add an item before checking out.");
      return;
    }

    if (!addressInput.trim()) {
      alert("Please specify a valid delivery shipping address coordinates parameters.");
      return;
    }

    // Capture currently logged-in user instance context metrics from authentication layer
    const { data: { user } } = await localSupabase.auth.getUser();
    
    if (!user) {
      alert("No active session identifier found. Please log in first.");
      window.location.href = 'index.html';
      return;
    }

    alert("Connecting to Egyptian secure processing framework link...\nTotal Amount: " + orderTotalEGP + " EGP\nUser Identifier: " + user.email);
  }
</script>

</body>
</html>
