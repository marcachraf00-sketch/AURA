<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA - Order Placed Successfully</title>

<style>
  body {
    background: #0f172a; 
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    letter-spacing: -0.01em;
  }

  .success-container {
    width: 100%;
    max-width: 500px;
    text-align: center;
  }

  .success-card {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 24px;
    padding: 40px 30px;
    box-sizing: border-box;
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
  }

  .icon-wrapper {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 80px;
    height: 80px;
    background: rgba(52, 211, 153, 0.1);
    border: 2px solid #34d399;
    border-radius: 50%;
    margin-bottom: 24px;
    color: #34d399;
    font-size: 40px;
    font-weight: bold;
    animation: scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes scaleUp {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 12px 0;
    letter-spacing: -0.02em;
    color: #ffffff;
  }

  p {
    font-size: 15px;
    color: #94a3b8;
    line-height: 1.6;
    margin: 0 0 32px 0;
  }

  .badge {
    color: #3b82f6;
    font-weight: 600;
  }

  button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: #3b82f6;
    color: #ffffff;
    border: none;
    transition: all 0.2s ease;
  }

  button:hover {
    background: #2563eb;
    transform: translateY(-2px);
    box-shadow: 0 8px 16px -4px rgba(59, 130, 246, 0.3);
  }
</style>
</head>
<body>

<div class="success-container">
  <div class="success-card">
    <div class="icon-wrapper">✓</div>
    <h1>Order Placed!</h1>
    <p>
      Thank you for shopping with <span class="badge">AURA</span>. Your order has been successfully submitted to our database matrix. Our operations team will process delivery verification and prepare fulfillment within 48 hours.
    </p>
    <button onclick="window.location.href='index.html'">Return to Store</button>
  </div>
</div>

</body>
</html>
